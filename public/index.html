<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T8 HUD</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage-frame">
  <div class="stage" id="stage">
    <div class="backdrop" aria-hidden="true"><canvas id="bg" width="48" height="27"></canvas></div>
    <div class="hud" id="hud">
      <div class="topbar">
        <div class="dev"><span><span class="live-dot" id="dot"></span><span id="devname">Connecting…</span></span><span id="devmeta"></span><span id="src"></span></div>
        <div class="clock" id="clock">--:--</div>
      </div>

      <div class="main">
        <div class="art" id="artbox"><img id="art" alt=""><div class="art-empty" id="artempty">No cover art</div></div>
        <div class="raw" id="raw"><h3>Raw getState fields</h3><dl id="rawdl"></dl></div>
        <div class="info">
          <div class="prov" id="prov"></div>
          <h1 class="title" id="title"></h1>
          <div>
            <div class="artist" id="artist"></div>
            <div class="album" id="album"></div>
          </div>
          <div class="progress"><span id="pos">0:00</span><div class="bar"><i id="bar"></i></div><span id="dur">0:00</span></div>
          <div class="tele">
            <div class="badges" id="badges"></div>
            <div class="decoder"><span id="ring"></span><span id="moved"></span></div>
            <div class="flags" id="flags"></div>
          </div>
        </div>
      </div>

      <div class="chain" id="chain">
        <canvas id="pulse"></canvas>
      </div>

      <div class="foot">
        <div class="stats" id="stats"></div>
        <div class="dacwin" id="dac" hidden></div>
        <div class="sig" id="sig" hidden aria-hidden="true">
          <svg viewBox="-160 -190 320 330"><defs><linearGradient id="sigLiq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e535c8"/><stop offset="1" stop-color="#7b2ff0"/></linearGradient><filter id="sigGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#sigGlow)"><path d="M-40 -60 V-160 Q-40 -172 -28 -172 H28 Q40 -172 40 -160 V-60 L130 95 Q145 125 110 125 H-110 Q-145 125 -130 95 Z" fill="none" stroke="#c86bff" stroke-width="18" stroke-linejoin="round"/><path d="M-66 -10 Q-50 -34 -33 -10 T0 -10 T33 -10 T66 -10 L118 90 Q126 108 104 108 H-104 Q-126 108 -118 90 Z" fill="url(#sigLiq)"/><text x="0" y="96" text-anchor="middle" font-family="Big Shoulders Display, sans-serif" font-weight="800" font-size="170" fill="#f3eefe">Z</text><circle cx="-66" cy="50" r="10" fill="#fff" opacity=".7"/><circle cx="70" cy="74" r="7" fill="#fff" opacity=".7"/></g></svg>
          <span><b>Z</b>RolesLabs</span>
        </div>
      </div>
    </div>

    <div class="idle" id="idle"><div class="idle-t">Nothing playing</div><div class="idle-s" id="idle-s"></div></div>
    <div class="night" aria-hidden="true"><div class="drift" id="drift"><div class="t" id="n-title"></div><div class="r" id="n-rate"></div></div></div>
    <div class="offline" id="offline" hidden>T8 asleep or offline · waiting for it</div>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
