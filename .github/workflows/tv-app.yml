name: TV app
# Builds the Google TV / Android TV app (android/). Pushing a version tag (v1.2.3) builds a signed APK
# and publishes a GitHub Release with it attached as t8-hud.apk (release notes: docs/release-notes.md
# if present). Publishing a release by hand in the GitHub UI does the same. So
# https://github.com/<repo>/releases/latest/download/t8-hud.apk always points at the newest one.
on:
  push:
    paths: ['android/**', 'public/**', 'lib/normalize.js', 'config.example.json', 'package.json', '.github/workflows/tv-app.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Release signing key (from repository secrets, if set)
        env:
          KEYSTORE_B64: ${{ secrets.T8HUD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "T8HUD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Set the T8HUD_KEYSTORE_B64 and T8HUD_KEYSTORE_PASSWORD secrets before publishing a release."; exit 1
          fi
      - name: Build the APK
        env:
          T8HUD_KEYSTORE_PASSWORD: ${{ secrets.T8HUD_KEYSTORE_PASSWORD }}
          T8HUD_VERSION_SUFFIX: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && '' || format('-dev.{0}', github.run_number) }}
          T8HUD_BUILD_NUMBER: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && '999' || github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk t8-hud.apk
      - uses: actions/upload-artifact@v4
        with:
          name: t8-hud-apk
          path: t8-hud.apk
      - name: Check the version matches the tag
        if: env.IS_RELEASE == 'true'
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }
      - name: Publish the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" t8-hud.apk --clobber
          else
            notes=docs/release-notes.md; [ -f "$notes" ] || { echo "T8 HUD $TAG" > /tmp/notes.md; notes=/tmp/notes.md; }
            gh release create "$TAG" t8-hud.apk --title "T8 HUD $TAG" --notes-file "$notes"
          fi
      - name: Keep the latest test build on the apk-builds branch
        if: env.IS_RELEASE != 'true' && github.repository == 'ZRolesLabs/t8-hud-dev'
        run: |
          mkdir out && cp t8-hud.apk out/ && cd out
          echo "${{ github.sha }} · run ${{ github.run_number }} · ${{ github.ref_name }}" > BUILD.txt
          git init -q -b apk-builds && git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "TV app test build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds
